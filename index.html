<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dev Task Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --accent: #2563eb;
    --accent2: #3b82f6;
    --accent-glow: rgba(37,99,235,0.18);
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #484f58;
    --green: #3fb950;
    --yellow: #d29922;
    --orange: #f0883e;
    --red: #f85149;
    --purple: #bc8cff;
    --teal: #39d353;
    --subtask-bg: #10141b;
    --in-progress-bg: rgba(37,99,235,0.13);
    --in-progress-text: #93c5fd;
    --done-bg: rgba(63,185,80,0.13);
    --done-text: #3fb950;
    --leave-bg: rgba(240,136,62,0.13);
    --leave-text: #f0883e;
    --blocked-bg: rgba(248,81,73,0.13);
    --blocked-text: #f85149;
    --onhold-bg: rgba(210,153,34,0.13);
    --onhold-text: #d29922;
    --raise-ic-bg: rgba(139,92,246,0.13);
    --raise-ic-text: #a78bfa;
    --raise-broker-bg: rgba(20,184,166,0.13);
    --raise-broker-text: #2dd4bf;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  /* TOP BAR */
  .topbar {
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    flex-wrap: wrap;
    gap: 16px;
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .logo-badge {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800; font-size: 18px;
    box-shadow: 0 0 18px rgba(37,99,235,0.4);
  }
  .topbar h1 {
    font-family: 'Syne', sans-serif;
    font-size: 20px; font-weight: 700;
    background: linear-gradient(90deg, #e6edf3, #93c5fd);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .topbar-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }

  .role-panel {
    display: flex; align-items: center; gap: 8px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
  }
  .role-panel label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--accent2); letter-spacing: 0.5px;}
  .role-select {
    background: transparent; border: none; color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 600; outline: none; cursor: pointer;
  }
  .role-select option { background: var(--surface2); color: var(--text); }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: none; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-primary {
    background: var(--accent); color: #fff;
    box-shadow: 0 0 14px rgba(37,99,235,0.35);
  }
  .btn-primary:hover { background: var(--accent2); box-shadow: 0 0 20px rgba(37,99,235,0.5); transform: translateY(-1px); }
  .btn-ghost {
    background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--border); color: var(--text); }
  .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }

  /* STATS ROW */
  .stats-row {
    display: flex; gap: 14px;
    padding: 20px 32px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    flex: 1; min-width: 120px;
    transition: all 0.25s;
    cursor: default;
  }
  .stat-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 20px var(--accent-glow); }
  .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; }
  .stat-value { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; margin-top: 4px; }
  .stat-value.blue { color: var(--accent2); }
  .stat-value.green { color: var(--green); }
  .stat-value.orange { color: var(--orange); }
  .stat-value.purple { color: var(--purple); }

  /* CONTROLS */
  .controls {
    padding: 14px 32px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .search-box {
    position: relative; flex: 1.5; min-width: 200px;
  }
  .search-box input {
    width: 100%; padding: 9px 14px 9px 36px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    transition: border-color 0.2s;
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
  
  .date-filter-group {
    display: flex; align-items: center; gap: 6px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px;
  }
  .date-filter-group label {
    font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .date-filter-group input[type="date"] {
    background: transparent; border: none; color: var(--text); font-size: 13px;
    font-family: 'DM Sans', sans-serif; outline: none; cursor: pointer;
  }
  .date-filter-group input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.9); cursor: pointer;
  }

  .filter-select {
    padding: 9px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 13px;
    font-family: 'DM Sans', sans-serif; cursor: pointer; outline: none;
    transition: border-color 0.2s;
  }
  .filter-select:focus { border-color: var(--accent); }
  .filter-select option { background: var(--surface2); }

  /* TABLE WRAPPER */
  .table-wrapper {
    padding: 20px 32px;
    overflow-x: auto;
  }
  table {
    width: 100%; border-collapse: collapse;
    min-width: 900px;
  }
  thead th {
    background: var(--surface2);
    padding: 12px 14px;
    font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-muted);
    text-align: left;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: color 0.2s;
  }
  thead th:hover { color: var(--accent2); }
  thead th .th-inner { display: flex; align-items: center; gap: 5px; }
  thead th .sort-icon { font-size: 10px; opacity: 0.5; transition: opacity 0.2s; }
  thead th.sorted .sort-icon { opacity: 1; color: var(--accent2); }

  tbody tr.main-task-row {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s, transform 0.15s, border-left 0.15s;
  }
  tbody tr.main-task-row:hover { background: rgba(37,99,235,0.04); }
  
  tbody tr.task-done-row {
    background: rgba(63, 185, 80, 0.04);
    border-left: 4px solid var(--green);
  }

  td {
    padding: 12px 14px;
    font-size: 13px;
    vertical-align: middle;
  }
  td.date { color: var(--text-muted); font-size: 12px; white-space: nowrap; }
  td.member { font-weight: 600; color: var(--text); white-space: nowrap; }
  td.task-title { color: var(--text); max-width: 240px; line-height: 1.5; }
  td.pct { font-family: 'Syne', sans-serif; font-weight: 700; text-align: center; }
  td.notes { color: var(--text-muted); font-size: 12px; max-width: 160px; }

  /* EXPAND ARROW */
  .expand-btn {
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; color: var(--text-muted); transition: transform 0.2s, color 0.2s;
    font-size: 10px; margin-right: 6px;
  }
  .expand-btn.expanded { transform: rotate(90deg); color: var(--accent2); }

  /* SUBTASK NESTED ROW GRID CONTAINER */
  .subtask-nested-row { display: none; background: var(--subtask-bg); border-bottom: 1px solid var(--border); }
  .subtask-wrapper { padding: 14px 24px 20px 48px; }
  .subtask-header-title {
    font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase;
    color: var(--purple); letter-spacing: 0.5px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
  }
  .subtask-table { width: 100%; border-collapse: collapse; min-width: unset !important; margin-top: 6px; }
  .subtask-table th {
    background: transparent; border-bottom: 1px solid var(--border); padding: 8px 10px;
    color: var(--text-muted); font-size: 11px; text-transform: uppercase; font-family: 'DM Sans', sans-serif; font-weight: 600;
  }
  .subtask-table td { padding: 8px 10px; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .subtask-table tr:last-child td { border-bottom: none; }

  /* STATUS BADGE */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    white-space: nowrap;
  }
  .badge.in-progress { background: var(--in-progress-bg); color: var(--in-progress-text); }
  .badge.done { background: var(--done-bg); color: var(--done-text); }
  .badge.on-leave { background: var(--leave-bg); color: var(--leave-text); }
  .badge.blocked { background: var(--blocked-bg); color: var(--blocked-text); }
  .badge.on-hold { background: var(--onhold-bg); color: var(--onhold-text); }
  .badge.raise-ic { background: var(--raise-ic-bg); color: var(--raise-ic-text); }
  .badge.raise-broker { background: var(--raise-broker-bg); color: var(--raise-broker-text); }

  /* PROGRESS BAR */
  .progress-wrap { display: flex; align-items: center; gap: 8px; }
  .progress-bar-bg {
    flex: 1; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; min-width: 50px;
  }
  .progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .pct-label { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; min-width: 32px; text-align: right; }

  .broker-tag {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 600;
    background: rgba(188,140,255,0.12); color: var(--purple); border: 1px solid rgba(188,140,255,0.2); white-space: nowrap;
  }

  .type-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 500; }
  .type-fe { background: rgba(57,211,83,0.1); color: var(--teal); border: 1px solid rgba(57,211,83,0.2); }
  .type-be { background: rgba(37,99,235,0.1); color: var(--accent2); border: 1px solid rgba(37,99,235,0.2); }
  .type-au { background: rgba(188,140,255,0.1); color: var(--purple); border: 1px solid rgba(188,140,255,0.2); }

  .editable { position: relative; border-radius: 5px; padding: 2px 4px; margin: -2px -4px; transition: background 0.15s; }
  body.role-admin .editable, body.role-manager .editable-pct { cursor: pointer; }
  
  body.role-admin .editable:hover, body.role-manager .editable-pct:hover { background: rgba(255,255,255,0.06); }
  body.role-admin .editable:hover::after, body.role-manager .editable-pct:hover::after { content: '✎'; font-size: 10px; margin-left: 5px; color: var(--text-dim); }

  .inline-edit {
    background: var(--surface2); border: 1px solid var(--accent); border-radius: 5px; color: var(--text); font-size: 13px;
    font-family: 'DM Sans', sans-serif; padding: 4px 8px; width: 100%; outline: none; box-shadow: 0 0 0 3px var(--accent-glow);
  }

  /* MODAL OVERLAY */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 32px; width: 620px; max-width: 95vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: modalIn 0.25s ease; max-height: 90vh; overflow-y: auto;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.94) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal h2 { font-family: 'Syne', sans-serif; font-size: 20px; margin-bottom: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1/-1; }
  .form-group label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-muted); }
  .form-group input, .form-group select, .form-group textarea {
    padding: 9px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px;
    font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .form-group select option { background: var(--surface2); }
  .form-group textarea { resize: vertical; min-height: 70px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }

  /* SUBTASK FORM MANAGER SECTION */
  .modal-subtasks-section { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 16px; }
  .modal-subtask-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }

  /* TOAST */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; font-size: 13px; color: var(--text);
    animation: toastIn 0.3s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 8px;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

  .row-actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
  tbody tr:hover .row-actions { opacity: 1; }
  .action-btn {
    width: 26px; height: 26px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .action-btn.edit { background: rgba(37,99,235,0.15); color: var(--accent2); }
  .action-btn.edit:hover { background: rgba(37,99,235,0.3); }
  .action-btn.clone { background: rgba(167,139,250,0.15); color: var(--purple); }
  .action-btn.clone:hover { background: rgba(167,139,250,0.3); }
  .action-btn.log { background: rgba(20, 184, 166, 0.15); color: #2dd4bf; }
  .action-btn.log:hover { background: rgba(20, 184, 166, 0.3); }
  .action-btn.delete { background: rgba(248,81,73,0.12); color: var(--red); }
  .action-btn.delete:hover { background: rgba(248,81,73,0.25); }

  .log-timeline { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; max-height: 350px; overflow-y: auto; padding-right: 4px; }
  .log-item { background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid #2dd4bf; padding: 10px 12px; border-radius: 6px; font-size: 12px; line-height: 1.4; }
  .log-timestamp { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-family: 'Syne', sans-serif; font-weight: 600; }

  body.role-viewer .action-btn.delete, body.role-viewer .action-btn.clone, body.role-viewer .action-btn.edit, body.role-viewer #btn-add-task,
  body.role-manager .action-btn.delete, body.role-manager .action-btn.clone, body.role-manager .action-btn.edit, body.role-manager #btn-add-task {
    display: none !important;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo-badge">D</div>
    <div>
      <div class="topbar h1" style="font-family:Syne,sans-serif;font-size:18px;font-weight:700;background:linear-gradient(90deg,#e6edf3,#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Dev Task Tracker</div>
      <div class="topbar-sub" id="today-date"></div>
    </div>
  </div>
  
  <div class="topbar-right">
    <div class="role-panel">
      <label>Workspace Access Role</label>
      <select class="role-select" id="app-user-role" onchange="changeUserRole(this.value)">
        <option value="Admin">Admin (Full Access)</option>
        <option value="Manager">Manager (Edit Status/Pct)</option>
        <option value="Viewer">Viewer (Read-Only Mode)</option>
      </select>
    </div>
    <button class="btn btn-ghost" onclick="exportExcel()">⬇ Export Excel</button>
    <button class="btn btn-primary" id="btn-add-task" onclick="openAddModal()">＋ Add Task</button>
  </div>
</div>

<div class="stats-row" id="stats-row"></div>

<div class="controls">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Search main tasks, subtasks, members..." oninput="renderTable()"/>
  </div>
  <div class="date-filter-group">
    <label>From</label>
    <input type="date" id="filter-from-date" onchange="renderTable()"/>
  </div>
  <div class="date-filter-group">
    <label>To</label>
    <input type="date" id="filter-to-date" onchange="renderTable()"/>
  </div>
  <select class="filter-select" id="filter-status" onchange="renderTable()">
    <option value="">All Statuses</option>
    <option value="In Progress">In Progress</option>
    <option value="Done">Done</option>
    <option value="On Leave">On Leave</option>
    <option value="Blocked">Blocked</option>
    <option value="On Hold">On Hold</option>
    <option value="Raise to IC">Raise to IC</option>
    <option value="Raise to Broker">Raise to Broker</option>
  </select>
  <select class="filter-select" id="filter-type" onchange="renderTable()">
    <option value="">All Types</option>
    <option value="Backend">Backend</option>
    <option value="AU Backend">AU Backend</option>
    <option value="Frontend">Frontend</option>
  </select>
  <select class="filter-select" id="filter-broker" onchange="renderTable()">
    <option value="">All Brokers</option>
  </select>
  <select class="filter-select" id="filter-member" onchange="renderTable()">
    <option value="">All Members</option>
  </select>
  <button class="btn btn-ghost" onclick="clearFilters()">✕ Clear</button>
</div>

<div class="table-wrapper">
  <table id="task-table">
    <thead>
      <tr>
        <th></th>
        <th onclick="sortBy('assignDate')"><div class="th-inner">Assign Date<span class="sort-icon">↕</span></div></th>
        <th onclick="sortBy('completionDate')"><div class="th-inner">Complete Date<span class="sort-icon">↕</span></div></th>
        <th onclick="sortBy('member')"><div class="th-inner">Lead Member<span class="sort-icon">↕</span></div></th>
        <th onclick="sortBy('type')"><div class="th-inner">Type<span class="sort-icon">↕</span></div></th>
        <th onclick="sortBy('broker')"><div class="th-inner">Broker Name<span class="sort-icon">↕</span></div></th>
        <th onclick="sortBy('title')"><div class="th-inner">Task Title & Sub-tasks<span class="sort-icon">↕</span></div></th>
        <th onclick="sortBy('status')"><div class="th-inner">Status<span class="sort-icon">↕</span></div></th>
        <th onclick="sortBy('dueTime')"><div class="th-inner">Due Time<span class="sort-icon">↕</span></div></th>
        <th onclick="sortBy('pct')"><div class="th-inner">% Done<span class="sort-icon">↕</span></div></th>
        <th>Notes / Blockers</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <div id="empty-state" class="empty-state" style="display:none;">
    <div class="icon">🔍</div>
    <p>No tasks match your active filters.</p>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">Add New Task</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Assign Date</label>
        <input type="date" id="f-date"/>
      </div>
      <div class="form-group">
        <label>Complete Date</label>
        <input type="date" id="f-completion-date"/>

<div class="modal-overlay" id="log-modal-overlay">
  <div class="modal" style="width: 480px;">

    <p id="log-modal-task-title" style="font-size: 13px; color: var(--text-muted); margin-top: -12px; margin-bottom: 12px; font-weight: 500;"></p>
    <hr style="border-color: var(--border); margin-bottom: 14px;">

      <button class="btn btn-ghost" onclick="closeLogModal()">Close View</button>
    </div>
  </div>

<div class="toast-container" id="toast-container"></div>

<script>
// ─── LOCAL STORAGE DATA CORNERSTONE ENGINE & AUTOMATED MIGRATION LAYER ────────
let tasks = JSON.parse(localStorage.getItem('dev_tasks_data')) || [];

let updatedMigration = false;
tasks = tasks.map(t => {
  let migrated = false;
  if (!t.subTasks) {
    t.subTasks = [{
      id: Math.floor(Math.random() * 1000000),
      title: t.title || 'Base Deliverable Implementation',
      member: t.member || 'Unassigned',
      status: t.status || 'In Progress',
      assignDate: t.assignDate || new Date().toISOString().split('T')[0],
      completionDate: t.status === 'Done' ? new Date().toISOString().split('T')[0] : '',
      logs: []
    }];
    migrated = true;
  }
  // Sanitize internal key tracks from past mismatch versions
  t.subTasks.forEach(st => {
    if (st.subId && !st.id) {
      st.id = st.subId;
      migrated = true;
    }
  });
  if (!t.hasOwnProperty('completionDate')) {
    t.completionDate = t.status === 'Done' ? (t.dueTime || new Date().toISOString().split('T')[0]) : '';
    migrated = true;
  }
  if (migrated) updatedMigration = true;
  return t;
});

if (updatedMigration) {
  localStorage.setItem('dev_tasks_data', JSON.stringify(tasks));
}

let nextId = parseInt(localStorage.getItem('dev_tasks_next_id')) || (tasks.length ? Math.max(...tasks.map(x=>x.id))+1 : 1);
let sortCol = 'assignDate', sortDir = 1;
let editingId = null;
let currentRole = localStorage.getItem('dev_tasks_role') || 'Admin';
let expandedTaskIds = new Set();

function saveToLocalStorage() {
  localStorage.setItem('dev_tasks_data', JSON.stringify(tasks));
  localStorage.setItem('dev_tasks_next_id', nextId);
}

// ─── ACCESS CONTROL INTERFACES ───────────────────────────────────────────────
function changeUserRole(newRole) {
  currentRole = newRole;
  localStorage.setItem('dev_tasks_role', newRole);
  document.body.className = '';
  document.body.classList.add('role-' + newRole.toLowerCase());
  renderTable();
  toast(`Switched workspace role to: ${newRole}`, '🔑');
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
const getPctColor = p => p >= 80 ? '#3fb950' : p >= 40 ? '#d29922' : '#f0883e';
const statusClass = s => ({ 'In Progress':'in-progress','Done':'done','On Leave':'on-leave','Blocked':'blocked','On Hold':'on-hold','Raise to IC':'raise-ic','Raise to Broker':'raise-broker' }[s] || 'in-progress');
const typeClass = t => ({ 'Backend':'type-be','AU Backend':'type-au','Frontend':'type-fe' }[t] || 'type-be');
const typeLabel = t => ({ 'Backend':'⚙ Backend','AU Backend':'🔷 AU Backend','Frontend':'🖥 Frontend' }[t] || t);
const fmtDate = d => d ? d.split('-').reverse().join('.') : '';

function toast(msg, type='✅') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${type}</span> ${msg}`;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function logActivity(targetObj, description) {
  if (!targetObj.logs) targetObj.logs = [];
  const timestamp = new Date().toLocaleString('en-IN', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
  });
  targetObj.logs.unshift({ timestamp, description });
}

// ─── TOGGLE COLLAPSIBLE ROW VISIBILITY ───────────────────────────────────────
function toggleTaskExpand(id, element) {
  const targetRow = document.getElementById(`subtask-row-${id}`);
  if (expandedTaskIds.has(id)) {
    expandedTaskIds.delete(id);
    if(element) element.classList.remove('expanded');
    if (targetRow) targetRow.style.display = 'none';
  } else {
    expandedTaskIds.add(id);
    if(element) element.classList.add('expanded');
    if (targetRow) targetRow.style.display = 'table-row';
  }
}

// ─── CLONE CORE TASK WRAPPERS ────────────────────────────────────────────────
function cloneTask(id) {
  if (currentRole === 'Viewer' || currentRole === 'Manager') return;
  const sourceTask = tasks.find(x => x.id === id);
  if (!sourceTask) return;

  const clonedSubtasks = (sourceTask.subTasks || []).map(st => ({
    id: Math.floor(Math.random() * 1000000),
    title: st.title + ' (Clone)',
    member: st.member,
    status: 'In Progress',
    assignDate: new Date().toISOString().split('T')[0],
    completionDate: '',
    logs: [{ timestamp: new Date().toLocaleString('en-IN'), description: 'Subtask cloned initialized.' }]
  }));

  const cloned = {
    ...sourceTask,
    id: nextId++,
    status: 'In Progress',
    pct: 0,
    assignDate: new Date().toISOString().split('T')[0],
    completionDate: '',
    title: sourceTask.title ? `${sourceTask.title} (Clone)` : 'Cloned Master Task',
    subTasks: clonedSubtasks,
    logs: []
  };

  logActivity(cloned, 'Cloned structural framework created successfully.');
  tasks.push(cloned);
  saveToLocalStorage();
  renderTable();
  toast('Task structure cloned! 🎉', '⧉');
}

// ─── STATS MATRICES ENGINE ────────────────────────────────────────────────────
function renderStats() {
  const total = tasks.length;
  const inProg = tasks.filter(t=>t.status==='In Progress').length;
  const done = tasks.filter(t=>t.status==='Done').length;
  const onHold = tasks.filter(t=>t.status==='On Hold').length;
  const raiseIC = tasks.filter(t=>t.status==='Raise to IC').length;
  const raiseBrk = tasks.filter(t=>t.status==='Raise to Broker').length;
  const avgPct = total ? Math.round(tasks.reduce((s,t)=>s+(parseInt(t.pct)||0),0)/total) : 0;
  
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Main Tasks</div><div class="stat-value blue">${total}</div></div>
    <div class="stat-card"><div class="stat-label">In Progress</div><div class="stat-value purple">${inProg}</div></div>
    <div class="stat-card"><div class="stat-label">Done</div><div class="stat-value green">${done}</div></div>
    <div class="stat-card"><div class="stat-label">On Hold</div><div class="stat-value" style="color:var(--onhold-text)">${onHold}</div></div>
    <div class="stat-card"><div class="stat-label">Raise to IC</div><div class="stat-value" style="color:var(--raise-ic-text)">${raiseIC}</div></div>
    <div class="stat-card"><div class="stat-label">Raise to Broker</div><div class="stat-value" style="color:var(--raise-broker-text)">${raiseBrk}</div></div>
    <div class="stat-card"><div class="stat-label">Avg Complete</div><div class="stat-value" style="color:#d29922">${avgPct}%</div></div>
  `;
}

// ─── NESTED SUB-TASK SUB-STATUS UPDATE ───────────────────────────────────────
function updateSubTaskStatus(mainId, subId, newStatus) {
  if (currentRole === 'Viewer') return;
  const mainTask = tasks.find(t => t.id === mainId);
  if (!mainTask) return;
  const sub = mainTask.subTasks.find(s => s.id === subId);
  if (!sub) return;

  const pastStatus = sub.status;
  if (pastStatus !== newStatus) {
    sub.status = newStatus;
    if(newStatus === 'Done') {
      sub.completionDate = new Date().toISOString().split('T')[0];
      logActivity(sub, `Status marked as complete. Date recorded.`);
    } else {
      sub.completionDate = '';
      logActivity(sub, `Status reverted from Done to "${newStatus}". Complete date cleared.`);
    }
    logActivity(mainTask, `Sub-task [${sub.title}] status shifted from "${pastStatus}" to "${newStatus}"`);
    
    saveToLocalStorage();
    renderTable();
    toast('Sub-task status updated!');
  }
}

// ─── FILTER CONTROL CONTROLLERS ───────────────────────────────────────────────
function populateFilters() {
  const brokers = [...new Set(tasks.map(t=>t.broker).filter(Boolean))].sort();
  const subtaskMembers = tasks.flatMap(t => (t.subTasks || []).map(st => st.member));
  const mainMembers = tasks.map(t => t.member);
  const members = [...new Set([...subtaskMembers, ...mainMembers].filter(Boolean))].sort();

  const fb = document.getElementById('filter-broker');
  const fm = document.getElementById('filter-member');
  const bv = fb.value, mv = fm.value;
  fb.innerHTML = '<option value="">All Brokers</option>' + brokers.map(b=>`<option value="${b}">${b}</option>`).join('');
  fm.innerHTML = '<option value="">All Members</option>' + members.map(m=>`<option value="${m}">${m}</option>`).join('');
  fb.value = bv; fm.value = mv;
}

function clearFilters() {
  document.getElementById('search-input').value='';
  document.getElementById('filter-from-date').value='';
  document.getElementById('filter-to-date').value='';
  document.getElementById('filter-status').value='';
  document.getElementById('filter-type').value='';
  document.getElementById('filter-broker').value='';
  document.getElementById('filter-member').value='';
  renderTable();
}

function sortBy(col) {
  if(sortCol===col) sortDir*=-1; else { sortCol=col; sortDir=1; }
  document.querySelectorAll('thead th').forEach(th=>th.classList.remove('sorted'));
  renderTable();
}

// ─── CORE RENDERING LOGIC ────────────────────────────────────────────────────
function renderTable() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const fromDate = document.getElementById('filter-from-date').value;
  const toDate = document.getElementById('filter-to-date').value;
  const fStatus = document.getElementById('filter-status').value;
  const fType = document.getElementById('filter-type').value;
  const fBroker = document.getElementById('filter-broker').value;
  const fMember = document.getElementById('filter-member').value;

  let filtered = tasks.filter(t => {
    const subtasksHaystack = (t.subTasks || []).map(st => (st.title||'') + ' ' + (st.member||'')).join(' ');
    const haystack = [(t.member||''),(t.title||''),(t.broker||''),(t.notes||''),(t.type||''), subtasksHaystack].join(' ').toLowerCase();
    
    const matchesFrom = !fromDate || t.assignDate >= fromDate;
    const matchesTo = !toDate || t.assignDate <= toDate;
    const matchesMember = !fMember || t.member === fMember || (t.subTasks || []).some(st => st.member === fMember);

    return (!search || haystack.includes(search))
      && matchesFrom && matchesTo
      && (!fStatus || t.status===fStatus)
      && (!fType || t.type===fType)
      && (!fBroker || t.broker===fBroker)
      && matchesMember;
  });

  const colMap = { assignDate:'assignDate', completionDate:'completionDate', member:'member', type:'type', broker:'broker', title:'title', status:'status', dueTime:'dueTime', pct:'pct' };
  const key = colMap[sortCol] || sortCol;
  filtered.sort((a,b) => {
    let av = a[key]||'', bv = b[key]||'';
    if(key==='pct') { av=+av; bv=+bv; }
    return av>bv ? sortDir : av<bv ? -sortDir : 0;
  });

  const tbody = document.getElementById('table-body');
  const empty = document.getElementById('empty-state');

  if(!filtered.length) {
    tbody.innerHTML=''; empty.style.display='block'; renderStats(); return;
  }
  empty.style.display='none';

  let htmlOut = '';
  filtered.forEach((t, i) => {
    const pctColor = getPctColor(t.pct);
    const rowDoneClass = t.status === 'Done' ? 'task-done-row' : '';
    const isArrowExpanded = expandedTaskIds.has(t.id) ? 'expanded' : '';
    const subrowStyleDisplay = expandedTaskIds.has(t.id) ? 'table-row' : 'none';
    const isStatusDisabled = currentRole === 'Viewer' ? 'disabled' : '';

    htmlOut += `
      <tr data-id="${t.id}" class="main-task-row ${rowDoneClass}">
        <td><span class="expand-btn ${isArrowExpanded}" onclick="toggleTaskExpand(${t.id}, this)">▶</span></td>
        <td class="date editable" onclick="if(currentRole==='Admin')editCell(${t.id},'assignDate',this)">${fmtDate(t.assignDate)}</td>
        <td class="date editable" onclick="if(currentRole==='Admin')editCell(${t.id},'completionDate',this)">${fmtDate(t.completionDate) || '<span style="color:var(--text-dim)">—</span>'}</td>
        <td class="member">${t.member||'<span style="color:var(--text-dim)">—</span>'}</td>
        <td><span class="type-tag ${typeClass(t.type)}">${typeLabel(t.type)}</span></td>
        <td class="editable" onclick="if(currentRole==='Admin')editCell(${t.id},'broker',this)">${t.broker ? `<span class="broker-tag">🏢 ${t.broker}</span>` : '<span style="color:var(--text-dim)">—</span>'}</td>
        <td class="task-title editable" onclick="if(currentRole==='Admin')editCell(${t.id},'title',this)">${t.title||'<span style="color:var(--text-dim)">—</span>'}</td>
        <td>
          <select class="badge ${statusClass(t.status)}" ${isStatusDisabled} onchange="updateMainStatusExplicit(${t.id},this.value)" style="border:none;background:inherit;color:inherit;font:inherit;cursor:pointer;padding:4px 8px;border-radius:20px;outline:none;">
            <option ${t.status==='In Progress'?'selected':''}>In Progress</option>
            <option ${t.status==='Done'?'selected':''}>Done</option>
            <option ${t.status==='Blocked'?'selected':''}>Blocked</option>
            <option ${t.status==='On Leave'?'selected':''}>On Leave</option>
            <option ${t.status==='On Hold'?'selected':''}>On Hold</option>
            <option ${t.status==='Raise to IC'?'selected':''}>Raise to IC</option>
            <option ${t.status==='Raise to Broker'?'selected':''}>Raise to Broker</option>
          </select>
        </td>
        <td class="date">${t.dueTime ? fmtDate(t.dueTime) : '<span style="color:var(--text-dim)">—</span>'}</td>
        
        <td class="editable-pct" onclick="if(currentRole==='Admin'||currentRole==='Manager')editCell(${t.id},'pct',this)">
          <div class="progress-wrap">
            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${t.pct}%;background:${pctColor}"></div></div>
            <span class="pct-label" style="color:${pctColor}">${t.pct}%</span>
          </div>
        </td>
        
        <td class="notes editable" onclick="if(currentRole==='Admin')editCell(${t.id},'notes',this)">${t.notes||'<span style="color:var(--text-dim)">—</span>'}</td>
        <td>
          <div class="row-actions">
            <button class="action-btn edit" onclick="openEditModal(${t.id})" title="Edit Task Structure">✎</button>
            <button class="action-btn clone" onclick="cloneTask(${t.id})" title="Clone Matrix Framework">⧉</button>
            <button class="action-btn log" onclick="openGlobalLogModal(${t.id}, 'main')" title="View Master Activity History Logs">⏳</button>
            <button class="action-btn delete" onclick="deleteTask(${t.id})" title="Delete Global Task Row">✕</button>
          </div>
        </td>
      </tr>
      
      <tr id="subtask-row-${t.id}" class="subtask-nested-row" style="display:${subrowStyleDisplay}">
        <td colspan="12">
          <div class="subtask-wrapper">
            <div class="subtask-header-title">
              <span>Nested Task Action Tracks Allocation</span>
            </div>
            <table class="subtask-table">
              <thead>
                <tr>
                  <th style="text-align:left; width:45%;">Subtask Name / Action Scope</th>
                  <th style="text-align:left; width:15%;">Assigned Team Member</th>
                  <th style="text-align:left; width:12%;">Assign Date</th>
                  <th style="text-align:left; width:12%;">Complete Date</th>
                  <th style="text-align:left; width:10%;">Status Badging</th>
                  <th style="text-align:center; width:6%;">Logs</th>
                </tr>
              </thead>
              <tbody>
                ${(t.subTasks || []).map(st => {
                  const viewSelectDisabled = currentRole === 'Viewer' ? 'disabled' : '';
                  return `
                    <tr>
                      <td style="color:var(--text); font-weight:500;">${st.title}</td>
                      <td style="color:var(--text-muted); font-weight:600;">🔷 ${st.member || 'Unassigned'}</td>
                      <td style="color:var(--text-muted); font-size:11px;">${fmtDate(st.assignDate) || '—'}</td>
                      <td style="color:#3fb950; font-size:11px; font-weight:600;">${fmtDate(st.completionDate) || '<span style="color:var(--text-dim)">—</span>'}</td>
                      <td>
                        <select class="badge ${statusClass(st.status)}" ${viewSelectDisabled} onchange="updateSubTaskStatus(${t.id}, ${st.id}, this.value)" style="border:none;background:transparent;color:inherit;font-size:11px;font-weight:600;cursor:pointer;outline:none;">
                          <option ${st.status==='In Progress'?'selected':''}>In Progress</option>
                          <option ${st.status==='Done'?'selected':''}>Done</option>
                          <option ${st.status==='Blocked'?'selected':''}>Blocked</option>
                          <option ${st.status==='On Leave'?'selected':''}>On Leave</option>
                          <option ${st.status==='On Hold'?'selected':''}>On Hold</option>
                          <option ${st.status==='Raise to IC'?'selected':''}>Raise to IC</option>
                          <option ${st.status==='Raise to Broker'?'selected':''}>Raise to Broker</option>
                        </select>
                      </td>
                      <td style="text-align:center;">
                        <button class="action-btn log" style="width:22px; height:22px; font-size:10px;" onclick="openGlobalLogModal(${t.id}, 'sub', ${st.id})" title="View Subtask Historical Logs">⏳</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = htmlOut;
  renderStats();
  populateFilters();
}

// ─── INLINE ENGINE CELL MUTATION CONTROLLERS ─────────────────────────────────
function editCell(id, field, cell) {
  if (field !== 'pct' && currentRole !== 'Admin') return;
  if (field === 'pct' && currentRole === 'Viewer') return;
  if (cell.querySelector('input')) return;
  
  const t = tasks.find(x=>x.id===id);
  const oldVal = t[field]||'';
  const el = document.createElement('input');
  el.className='inline-edit';
  el.value = oldVal;
  
  if (field === 'pct') { 
    el.type = 'number'; 
    el.min = 0; 
    el.max = 100; 
  } else if (field.toLowerCase().includes('date')) {
    el.type = 'date';
  }
  
  cell.innerHTML='';
  cell.appendChild(el);
  el.focus();
  
  const save = () => {
    let newVal = el.value.trim();
    if (field === 'pct') {
      newVal = parseInt(newVal) || 0;
      if (newVal > 100) newVal = 100;
      if (newVal < 0) newVal = 0;
    }

    if (String(oldVal) !== String(newVal)) {
      t[field] = newVal;
      let labelField = field === 'pct' ? '% Done' : field;
      logActivity(t, `Manual Override: ${labelField} updated from "${oldVal}" to "${newVal}"`);
      
      if (field === 'pct' && newVal === 100 && t.status !== 'Done') {
        t.status = 'Done';
        t.completionDate = new Date().toISOString().split('T')[0];
        logActivity(t, `Status updated automatically to "Done" via manual 100% completion entry.`);
      }
      saveToLocalStorage();
    }
    renderTable();
    toast('Field updated');
  };
  el.addEventListener('blur', save);
  el.addEventListener('keydown', e => { if(e.key==='Enter') { e.preventDefault(); save(); } if(e.key==='Escape') renderTable(); });
}

function updateMainStatusExplicit(id, val) {
  if (currentRole === 'Viewer') return;
  const t = tasks.find(x=>x.id===id);
  const old = t.status;
  if (old !== val) {
    t.status = val;
    if(val === 'Done') {
      t.pct = 100;
      t.completionDate = new Date().toISOString().split('T')[0];
      (t.subTasks || []).forEach(st => {
        if(st.status !== 'Done') {
          st.status = 'Done';
          st.completionDate = new Date().toISOString().split('T')[0];
        }
      });
      logActivity(t, `Force override structural change: Task and all subtasks set to complete.`);
    } else {
      t.completionDate = '';
    }
    logActivity(t, `Explicit status shift: "${old}" ➔ "${val}"`);
    saveToLocalStorage();
    renderTable();
    toast('Status modified');
  }
}

// ─── DELETE ACTION LAYERS ────────────────────────────────────────────────────
function deleteTask(id) {
  if (currentRole !== 'Admin') return;
  if(!confirm('Delete this main task configuration alongside all sub-task entries?')) return;
  tasks = tasks.filter(t=>t.id!==id);
  saveToLocalStorage();
  renderTable();
  toast('Task destroyed','🗑');
}

// ─── DYNAMIC FORM MODAL SUB-GRID BLUEPRINTS GENERATOR ───────────────────────
function addBlankSubtaskFormRow(title = '', member = '', status = 'In Progress', assignDate = '', completionDate = '', id = '') {
  const container = document.getElementById('modal-subtasks-container');
  // UNIFIED KEY STAMPING: Enforce standard st.id mapping configuration

  div.innerHTML = `
    <input type="text" class="sub-f-title" style="flex:2;" value="${escapeHtml(title)}" placeholder="Subtask scope statement..." required />
    <input type="text" class="sub-f-member" style="flex:1;" value="${escapeHtml(member)}" placeholder="Assignee Name" />
    <input type="date" class="sub-f-assign-date" style="flex:1; font-size:11px;" value="${assignVal}" />
    <input type="date" class="sub-f-completion-date" style="flex:1; font-size:11px;" value="${completionDate}" placeholder="Complete Date" />
    <select class="sub-f-status" style="width:110px;">
      <option ${status==='In Progress'?'selected':''}>In Progress</option>
      <option ${status==='Done'?'selected':''}>Done</option>
      <option ${status==='Blocked'?'selected':''}>Blocked</option>
      <option ${status==='On Leave'?'selected':''}>On Leave</option>
      <option ${status==='On Hold'?'selected':''}>On Hold</option>
      <option ${status==='Raise to IC'?'selected':''}>Raise to IC</option>
      <option ${status==='Raise to Broker'?'selected':''}>Raise to Broker</option>
    </select>
    <button class="action-btn delete" type="button" onclick="this.parentElement.remove()">✕</button>
  `;
  container.appendChild(div);
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// ─── STRUCTURAL MANAGEMENT DIALOG WINDOWS ────────────────────────────────────
function openAddModal() {
  if (currentRole !== 'Admin') return;
  editingId = null;
  document.getElementById('modal-title').textContent = 'Add New Task Structure';
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('f-completion-date').value = '';
  document.getElementById('f-member').value = '';
  document.getElementById('f-type').value = 'Backend';
  document.getElementById('f-broker').value = '';
  document.getElementById('f-title').value = '';
  document.getElementById('f-due').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('modal-subtasks-container').innerHTML = '';
  
  addBlankSubtaskFormRow('Deliverable Core Execution Base');
  document.getElementById('modal-overlay').classList.add('open');
}

function openEditModal(id) {
  if (currentRole !== 'Admin') return;
  editingId = id;
  const t = tasks.find(x=>x.id===id);
  document.getElementById('modal-title').textContent = 'Edit Task Architecture';
  document.getElementById('f-date').value = t.assignDate || '';
  document.getElementById('f-completion-date').value = t.completionDate || '';
  document.getElementById('f-member').value = t.member || '';
  document.getElementById('f-type').value = t.type || 'Backend';
  document.getElementById('f-broker').value = t.broker || '';
  document.getElementById('f-title').value = t.title || '';
  document.getElementById('f-due').value = t.dueTime || '';
  document.getElementById('f-notes').value = t.notes || '';
  
  const container = document.getElementById('modal-subtasks-container');
  container.innerHTML = '';
  
  if(t.subTasks && t.subTasks.length) {
    t.subTasks.forEach(st => {
      addBlankSubtaskFormRow(st.title, st.member, st.status, st.assignDate, st.completionDate, st.id);
    });
  } else {
    addBlankSubtaskFormRow('Deliverable Core Execution Base');
  }
  
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

function saveTask() {
  if (currentRole !== 'Admin') return;
  
  const memberLeadInput = document.getElementById('f-member').value.trim();
  if(!memberLeadInput) { alert('Main Team Member Lead Assignee is required'); return; }

  const subRows = document.querySelectorAll('.modal-subtask-row');
  let compiledSubtasks = [];
  const oldTaskRef = editingId ? tasks.find(x => x.id === editingId) : null;

  subRows.forEach(row => {
    const subId = parseInt(row.getAttribute('data-sub-id'));
    const title = row.querySelector('.sub-f-title').value.trim() || 'Action Item Scope';
    const member = row.querySelector('.sub-f-member').value.trim() || memberLeadInput;
    const status = row.querySelector('.sub-f-status').value;
    const assignDate = row.querySelector('.sub-f-assign-date').value || new Date().toISOString().split('T')[0];
    let completionDate = row.querySelector('.sub-f-completion-date').value;
    
    if (status === 'Done' && !completionDate) {
      completionDate = new Date().toISOString().split('T')[0];
    } else if (status !== 'Done') {
      completionDate = '';
    }

    let existingLogs = [];
    if (oldTaskRef && oldTaskRef.subTasks) {
      const oldSub = oldTaskRef.subTasks.find(s => s.id === subId);
      if (oldSub && oldSub.logs) existingLogs = oldSub.logs;
    }

    // Unified key property configuration assembly
    compiledSubtasks.push({ id: subId, title, member, status, assignDate, completionDate, logs: existingLogs });
  });

  const data = {
    assignDate: document.getElementById('f-date').value,
    completionDate: document.getElementById('f-completion-date').value,
    member: memberLeadInput,
    type: document.getElementById('f-type').value,
    broker: document.getElementById('f-broker').value.trim(),
    title: document.getElementById('f-title').value.trim(),
    dueTime: document.getElementById('f-due').value,
    notes: document.getElementById('f-notes').value.trim(),
    subTasks: compiledSubtasks,
    status: editingId ? oldTaskRef.status : 'In Progress',
    pct: editingId ? oldTaskRef.pct : 0
  };

  if(editingId) {
    logActivity(oldTaskRef, `Structural Framework updated via Admin management terminal modification.`);
    Object.assign(oldTaskRef, data);
    toast('Architecture mapped ✨');
  } else {
    const createdId = nextId++;
    const freshBlock = { id: createdId, ...data, logs: [] };
    logActivity(freshBlock, 'Master database entry task initialization.');
    tasks.push(freshBlock);
    
    // Auto-open accordion view upon row creation
    expandedTaskIds.add(createdId);
    toast('Task stack deployed 🎉');
  }
  
  saveToLocalStorage();
  closeModal();
  renderTable();
}

// ─── LOG LAYER CONSOLE VISUALIZATION WINDOWS ──────────────────────────────────
function openGlobalLogModal(mainId, category, subId = null) {
  const t = tasks.find(x => x.id === mainId);
  if (!t) return;
  
  const header = document.getElementById('log-modal-header-title');
  const taskTitleEl = document.getElementById('log-modal-task-title');
  const timeline = document.getElementById('log-modal-timeline');
  timeline.innerHTML = '';

  if (category === 'main') {
    header.textContent = 'Master Task Tracker Activity Log';
    taskTitleEl.textContent = `Scope Context: ${t.title || 'Global Parent Header'}`;
    renderTimelineLogsList(t.logs, timeline);
  } else {
    const subItem = (t.subTasks || []).find(s => s.id === subId);
    if(!subItem) return;
    header.textContent = 'Subtask Action Activity Log';
    taskTitleEl.textContent = `Subtask Module: ${subItem.title}`;
    renderTimelineLogsList(subItem.logs, timeline);
  }

  document.getElementById('log-modal-overlay').classList.add('open');
}

function renderTimelineLogsList(logArray, targetContainer) {
  const list = logArray || [];
  if (list.length === 0) {
    targetContainer.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-dim); font-size:12px;">No historical activities registered under this layer.</div>`;
  } else {
    targetContainer.innerHTML = list.map(log => `
      <div class="log-item">
        <div class="log-timestamp">${log.timestamp}</div>
        <div class="log-text">${log.description}</div>
      </div>
    `).join('');
  }
}

function closeLogModal() { document.getElementById('log-modal-overlay').classList.remove('open'); }

// ─── DATA SHEET EXPORT CONTROLLERS ───────────────────────────────────────────
function getFilteredTasks() {
  const search  = document.getElementById('search-input').value.toLowerCase();
  const fromDate = document.getElementById('filter-from-date').value;
  const toDate = document.getElementById('filter-to-date').value;
  const fStatus = document.getElementById('filter-status').value;
  const fType   = document.getElementById('filter-type').value;
  const fBroker = document.getElementById('filter-broker').value;
  const fMember = document.getElementById('filter-member').value;
  return tasks.filter(t => {
    const subtasksHaystack = (t.subTasks || []).map(st => (st.title||'') + ' ' + (st.member||'')).join(' ');
    const hay = [(t.member||''),(t.title||''),(t.broker||''),(t.notes||''),(t.type||''), subtasksHaystack].join(' ').toLowerCase();
    const matchesFrom = !fromDate || t.assignDate >= fromDate;
    const matchesTo = !toDate || t.assignDate <= toDate;
    const matchesMember = !fMember || t.member === fMember || (t.subTasks || []).some(st => st.member === fMember);

    return (!search || hay.includes(search))
      && matchesFrom && matchesTo
      && (!fStatus || t.status===fStatus)
      && (!fType   || t.type===fType)
      && (!fBroker || t.broker===fBroker)
      && matchesMember;
  });
}

function exportExcel() {
  const filtered = getFilteredTasks();
  if (!filtered.length) { toast('No tasks to export', '⚠️'); return; }

  const headers = [
    'Main Assign Date', 'Main Complete Date', 'Lead Member', 'Type', 'Broker Name', 
    'Main Task Title', 'Overall Status', 'Due Date', 'Total % Done', 'Notes / Blockers',
    'Sub-Task Assigned Member', 'Sub-Task Assign Date', 'Sub-Task Complete Date', 'Sub-Task Action Scope Title', 'Sub-Task Status'
  ];

  const escape = val => {
    const str = (val === null || val === undefined) ? '' : String(val);
    if (str.includes(',') || str.includes('\n') || str.includes('"')) {
      return '"' + str.replace(/"/g, '""').replace(/\n/g, ' | ') + '"';
    }
    return str;
  };

  let rows = [];

  filtered.forEach(t => {
    const subTasksList = t.subTasks || [];
    if (subTasksList.length === 0) {
      rows.push([
        fmtDate(t.assignDate), fmtDate(t.completionDate) || '—', t.member, t.type, t.broker, 
        t.title, t.status, fmtDate(t.dueTime) || '—', t.pct + '%', t.notes || '—',
        '—', '—', '—', '—', '—'
      ].map(escape).join(','));
    } else {
      subTasksList.forEach(st => {
        rows.push([
          fmtDate(t.assignDate), fmtDate(t.completionDate) || '—', t.member, t.type, t.broker, 
          t.title, t.status, fmtDate(t.dueTime) || '—', t.pct + '%', t.notes || '—',
          st.member || t.member, fmtDate(st.assignDate), fmtDate(st.completionDate) || '—', st.title, st.status
        ].map(escape).join(','));
      });
    }
  });

  const csv = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  
  const nowStr = new Date().toLocaleDateString('en-IN').replace(/\//g,'-');

  const fStatus = document.getElementById('filter-status').value;
  const fMember = document.getElementById('filter-member').value;
  const fBroker = document.getElementById('filter-broker').value;
  const suffix  = [fStatus, fMember, fBroker].filter(Boolean).join('_') || 'All';

  a.href = url;
  a.download = `DevTasks_DetailedReport_${suffix}_${nowStr}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Report downloaded successfully ✅`);
}
